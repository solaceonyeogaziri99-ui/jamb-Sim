<!DOCTYPE html>

<html lang="en">

<head>

    ```
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CBT Examination</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    ```

</head>

<body>

    ```
    <header class="cbt-header">

        <div class="container">

            <div class="header-content">

                <div>

                    <h1>Nursing CBT</h1>

                    <p id="subjectName">
                        Biology
                    </p>

                </div>


                <div class="timer-box">

                    <small>TIME LEFT</small>

                    <h3 id="timer">
                        60:00
                    </h3>

                </div>

            </div>

            <div class="subject-progress-wrap">

                <div class="subject-progress" id="subjectProgress">
                </div>

            </div>

        </div>

    </header>


    <main class="container my-4">

        <div class="row g-4">


            <!-- QUESTION -->

            <div class="col-lg-8">

                <div class="question-card">

                    <div class="question-top">

                        <span class="badge bg-primary" id="questionSubject">
                            Biology
                        </span>


                        <span>

                            Question

                            <strong id="currentQuestion">
                                1
                            </strong>

                            of

                            <strong id="totalQuestions">
                                20
                            </strong>

                        </span>

                    </div>


                    <hr>


                    <h2 class="question" id="questionText">

                        Loading question...

                    </h2>


                    <div class="options" id="optionsContainer">

                    </div>


                    <div class="navigation">

                        <button class="btn btn-outline-secondary" id="previousBtn">

                            ← Previous

                        </button>


                        <button class="btn btn-primary" id="nextBtn">

                            Next →

                        </button>

                    </div>

                </div>

            </div>


            <!-- QUESTION NAVIGATOR -->

            <div class="col-lg-4">

                <div class="navigator-card">

                    <h4>
                        Question Navigator
                    </h4>

                    <p class="text-muted">
                        Select a question.
                    </p>


                    <div class="question-numbers" id="questionNumbers">

                    </div>


                    <hr>


                    <div class="legend">

                        <div>
                            <span class="legend-box answered">
                            </span>

                            Answered
                        </div>


                        <div>
                            <span class="legend-box unanswered">
                            </span>

                            Unanswered
                        </div>


                        <div>
                            <span class="legend-box current">
                            </span>

                            Current
                        </div>

                    </div>


                    <button class="btn btn-danger w-100 mt-4" id="submitBtn">

                        Submit Examination

                    </button>

                </div>

            </div>

        </div>

    </main>

 <script src="data/biology.js"></script>
 <script src="data/chemistry.js"></script>
 <script src="data/physics.js"></script>
 <script src="data/mathematics.js"></script>
 <script src="data/english.js"></script>
 <script src="data/general-Knowledge.js"></script>
<script src="js/exam.js"></script>


</body>

</html>
